<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="pbpsBgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="pbpsGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Sun & Flame Gradient -->
    <linearGradient id="pbpsSunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Blue Royal Gradient -->
    <linearGradient id="pbpsBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Outer Shadow & Base Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#pbpsBgGrad)" stroke="url(#pbpsGoldGrad)" stroke-width="4.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#pbpsGoldGrad)" stroke-width="2" />

  <!-- Circular Text Path for PRAGYA BHARTI PUBLIC SCHOOL -->
  <path id="topTextArc" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#fef08a" letter-spacing="2.2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      PRAGYA BHARTI PUBLIC SCHOOL
    </textPath>
  </text>

  <!-- Inner Medallion Background -->
  <circle cx="100" cy="108" r="54" fill="#0f172a" stroke="url(#pbpsGoldGrad)" stroke-width="2.5" />

  <!-- Rising Sun Rays in Medallion -->
  <g opacity="0.85">
    <line x1="100" y1="92" x2="100" y2="62" stroke="url(#pbpsSunGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="84" y1="94" x2="71" y2="69" stroke="url(#pbpsSunGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="116" y1="94" x2="129" y2="69" stroke="url(#pbpsSunGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="71" y1="101" x2="52" y2="83" stroke="url(#pbpsSunGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="129" y1="101" x2="148" y2="83" stroke="url(#pbpsSunGrad)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Rising Sun Half Circle -->
  <circle cx="100" cy="104" r="17" fill="url(#pbpsSunGrad)" />

  <!-- Open Academic Book of Wisdom (Pragya) -->
  <g id="openBook" transform="translate(0, 15)">
    <!-- Book Pages Base -->
    <path d="M 100 95 C 90 92, 74 91, 62 95 C 60 96, 59 98, 59 101 L 59 122 C 73 118, 89 119, 100 124 C 111 119, 127 118, 141 122 L 141 101 C 141 98, 140 96, 138 95 C 126 91, 110 92, 100 95 Z"
          fill="#f8fafc" stroke="#334155" stroke-width="1.2" />

    <!-- Left Page Folds -->
    <path d="M 100 98 C 91 95, 77 94, 63 98 L 63 119 C 75 116, 89 116, 100 121 Z"
          fill="#f1f5f9" />
    <!-- Page Lines on Left -->
    <line x1="68" y1="104" x2="94" y2="101" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="68" y1="109" x2="94" y2="106" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="68" y1="114" x2="92" y2="111" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Page Folds -->
    <path d="M 100 98 C 109 95, 123 94, 137 98 L 137 119 C 125 116, 111 116, 100 121 Z"
          fill="#e2e8f0" />
    <!-- Page Lines on Right -->
    <line x1="106" y1="101" x2="132" y2="104" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="106" y1="106" x2="132" y2="109" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="108" y1="111" x2="132" y2="114" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Center Spine & Bookmark Ribbon -->
    <line x1="100" y1="95" x2="100" y2="124" stroke="#d97706" stroke-width="2.5" />
    <path d="M 100 124 L 98 131 L 100 129 L 102 131 Z" fill="#d97706" />
  </g>

  <!-- Laurel Wreath Leaves on Left & Right of Shield -->
  <g fill="url(#pbpsGoldGrad)">
    <!-- Left Leaves -->
    <ellipse cx="44" cy="98" rx="4.5" ry="2.2" transform="rotate(-35 44 98)" />
    <ellipse cx="40" cy="110" rx="4.8" ry="2.3" transform="rotate(-15 40 110)" />
    <ellipse cx="41" cy="122" rx="4.8" ry="2.3" transform="rotate(10 41 122)" />
    <ellipse cx="47" cy="134" rx="4.8" ry="2.3" transform="rotate(35 47 134)" />
    <!-- Right Leaves -->
    <ellipse cx="156" cy="98" rx="4.5" ry="2.2" transform="rotate(35 156 98)" />
    <ellipse cx="160" cy="110" rx="4.8" ry="2.3" transform="rotate(15 160 110)" />
    <ellipse cx="159" cy="122" rx="4.8" ry="2.3" transform="rotate(-10 159 122)" />
    <ellipse cx="153" cy="134" rx="4.8" ry="2.3" transform="rotate(-35 153 134)" />
  </g>

  <!-- Bottom Ribbon Banner with PBPS -->
  <g id="bannerRibbon">
    <!-- Ribbon Tail Left -->
    <path d="M 36 166 L 50 150 L 50 172 Z" fill="#92400e" />
    <path d="M 30 166 L 46 150 L 46 172 Z" fill="#b45309" />
    <!-- Ribbon Tail Right -->
    <path d="M 164 166 L 150 150 L 150 172 Z" fill="#92400e" />
    <path d="M 170 166 L 154 150 L 154 172 Z" fill="#b45309" />

    <!-- Main Front Ribbon -->
    <path d="M 44 154 Q 100 146 156 154 L 152 176 Q 100 168 48 176 Z"
          fill="url(#pbpsGoldGrad)" stroke="#78350f" stroke-width="1.2" />

    <!-- PBPS Banner Text -->
    <text x="100" y="170" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3.5">
      PBPS
    </text>
  </g>

  <!-- Little Decorative Golden Stars on Ribbon Ends -->
  <polygon points="56,162 57.5,165 61,165.5 58.5,168 59,171.5 56,170 53,171.5 53.5,168 51,165.5 54.5,165" fill="#0f172a" opacity="0.6" />
  <polygon points="144,162 145.5,165 149,165.5 146.5,168 147,171.5 144,170 141,171.5 141.5,168 139,165.5 142.5,165" fill="#0f172a" opacity="0.6" />

  <!-- Bottom Subtext: ESTD / KNOWLEDGE IS POWER -->
  <path id="bottomTextArc" d="M 60 186 A 78 78 0 0 0 140 186" fill="none" />
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#fef08a" letter-spacing="2">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ ESTD · EXCELLENCE ★
    </textPath>
  </text>
</svg>
